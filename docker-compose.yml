services:
  shayfin:
    build:
      context: .
    image: shayfin:local
    init: true
    restart: unless-stopped
    ports:
      - '${SHAYFIN_PORT:-3000}:3000'
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: '${SHAYFIN_ORIGIN:-http://localhost:3000}'
      SHAYFIN_DATA_DIR: /data
    volumes:
      - shayfin-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  shayfin-data:
